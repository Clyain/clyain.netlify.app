<!DOCTYPE html>
<html lang="ch">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" href="../favicon.ico">

    <link rel="stylesheet" href="../styles/Global.css">
    <link rel="stylesheet" href="../styles/Content.css">
    <link rel="stylesheet" href="../styles/Card.css">
    <link rel="stylesheet" href="../styles/HeadBtn.css">
    <link rel="stylesheet" href="../styles/Lable.css">
    <link rel="stylesheet" href="../styles/BasicBtn.css">

    <title>Clyain 的在线游玩</title>
    <style>
        .onlineplay-btn {
            background: #eef2ff;
            color: #166534;
        }

        img {
            user-select: none;
        }
    </style>
</head>

<body>
    <div class="background"></div>
    <div class="content">
        <a class="head-btn" href="../"><span class="no-select">首页</span></a>
        <div style="flex:1; text-align:center;" class="no-select">
            <h1 style="margin:0;">在线游玩</h1>
            <p style="margin:0;">Clyain</p>
        </div>
        <hr>
        <div class="cards-container">
            <div class="card" data-card="1">
                <div class="card-content">
                    <img src="epnc3/cover.png" alt="EPNC-超强数值计算器 Ver.3.0.0" style="width:100%; border-radius: 10px;"
                        draggable="false">
                    <p class="title">
                        <span class="no-select">EPNC-超强数值计算器 Ver.3.0.0</span>
                    </p>
                    <div class="label-group">
                        <div class="label" style="border: 1px solid #e54646; background-color: #e99f9f;"><span class="no-select">不进行维护</span></div>
                        <div class="label" style="border: 1px solid #e54646; background-color: #e99f9f;"><span class="no-select">可能含有bug！</span></div>
                    </div>
                    <p class="desc">
                        <span class="no-select">一款功能强大的数值计算器，支持复杂数学运算。<br>更新日期：2025-12-27。</span>
                    </p>
                    <div class="basic-btn-group">
                        <button class="basic-btn onlineplay-btn" onclick="window.open('epnc3/', '_blank')">
                            <span class="no-select">在线游玩</span>
                            <svg width="13.5" height="13.5" aria-hidden="true" viewBox="0 0 24 24"><path fill="currentColor" d="M21 13v10h-21v-19h12v2h-10v15h17v-8h2zm3-12h-10.988l4.035 4-6.977 7.07 2.828 2.828 6.977-7.07 4.125 4.172v-11z"></path></svg>
                        </button>
                    </div>
                </div>
            </div>
            <div class="card" data-card="2">
                <div class="card-content">
                    <img src="eptex/cover.png" alt="EPTeX Ver.0.6.7" style="width:100%; border-radius: 10px;"
                        draggable="false">
                    <p class="title">
                        <span class="no-select">EPTeX Ver.0.6.7</span>
                    </p>
                    <div class="label-group">
                        <div class="label"
                            style="border: 1px solid hsl(185, 75%, 59%); background-color: hsl(185, 63%, 77%);"><span class="no-select">最新！</span>
                        </div>
                    </div>
                    <p class="desc">
                        <span class="no-select">一款强大的TeX编辑器，支持渲染超多LaTeX能显示的公式。<br>更新日期：2026-06-07。</span>
                    </p>
                    <div class="basic-btn-group">
                        <button class="basic-btn onlineplay-btn" onclick="window.open('eptex/', '_blank')">
                            <span class="no-select">在线游玩</span>
                            <svg width="13.5" height="13.5" aria-hidden="true" viewBox="0 0 24 24"><path fill="currentColor" d="M21 13v10h-21v-19h12v2h-10v15h17v-8h2zm3-12h-10.988l4.035 4-6.977 7.07 2.828 2.828 6.977-7.07 4.125 4.172v-11z"></path></svg>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
